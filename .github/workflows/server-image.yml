# A one-off server image for trying an unreleased build: run it by hand from the Actions tab
# ("Run workflow", on any branch). It publishes ghcr.io/djgosnell/instella-server:edge, replacing
# the previous :edge. Nothing builds it automatically: release images (:<version>, :latest) come
# only from release tags (release.yml).
# Update a host with: scripts/deploy.sh edge --pull
name: server-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/djgosnell/instella-server

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test tests/Instella.Server.Tests -c Release
      - run: dotnet publish src/Instella.Server -c Release -o src/Instella.Server/publish -p:VersionSuffix=edge.${{ github.run_number }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t $IMAGE:edge src/Instella.Server
      - run: docker push $IMAGE:edge
